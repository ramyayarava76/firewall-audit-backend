services:
  - type: web
    name: firewall-audit-backend
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LOG_LEVEL
        value: INFO
      - key: DETAILED_LOGS
        value: "false"
      - key: DISABLE_LOGGING
        value: "false"
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["*"]'
